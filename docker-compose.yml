services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mini_jira
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/mini_jira
      JWT_SECRET: change-me-in-production
      FRONTEND_URL: https://jira.qwarts.my.id
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PUBLIC_API_URL: https://api-jira.qwarts.my.id
      ORIGIN: https://jira.qwarts.my.id
      COOKIE_DOMAIN: .qwarts.my.id
    ports:
      - "127.0.0.1:5173:3000"

volumes:
  pgdata:
